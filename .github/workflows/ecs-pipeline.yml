name: Build, Push, and Deploy to ECS

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lab2-ecs-role
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR with GHA Caching
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.LAB2_ECR_REPO }}:${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pass built image URI to output step
        id: image-output
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.LAB2_ECR_REPO }}:${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/pipeline/taskdef-template.json
          container-name: lab2-app
          image: ${{ steps.image-output.outputs.image }}

      - name: Deploy to Amazon ECS via CodeDeploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: lab2-service
          cluster: lab2-ecs-cluster
          codedeploy-application: lab2-app
          codedeploy-deployment-group: lab2-deployment-group
          codedeploy-appspec: infra/pipeline/appspec.yaml
