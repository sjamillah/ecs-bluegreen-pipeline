AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate service with blue/green ALB target groups using imported network resources

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI including tag for the initial task definition
  TaskExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: lab2-ecs-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/lab2-app
      RetentionInDays: 14

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: lab2-app
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: lab2-app
          Image: !Ref ImageUri
          PortMappings: [{ContainerPort: 8080}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: lab2-alb
      Scheme: internet-facing
      Subnets:
        - !ImportValue lab2-PublicSubnetAId
        - !ImportValue lab2-PublicSubnetBId
      SecurityGroups:
        - !ImportValue lab2-ALBSecurityGroupId

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: lab2-tg-blue
      Port: 8080
      Protocol: HTTP
      VpcId: !ImportValue lab2-VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: lab2-tg-green
      Port: 8080
      Protocol: HTTP
      VpcId: !ImportValue lab2-VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref BlueTargetGroup}]

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: lab2-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentController: { Type: CODE_DEPLOY }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !ImportValue lab2-PrivateSubnetAId
            - !ImportValue lab2-PrivateSubnetBId
          SecurityGroups:
            - !ImportValue lab2-ECSTaskSecurityGroupId
          AssignPublicIp: DISABLED
      LoadBalancers:
        - {ContainerName: lab2-app, ContainerPort: 8080, TargetGroupArn: !Ref BlueTargetGroup}

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub service/${ECSCluster}/${ECSService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: lab2-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 50
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: lab2-ClusterName
  ServiceName:
    Value: !GetAtt ECSService.Name
    Export:
      Name: lab2-ServiceName
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: lab2-BlueTargetGroupName
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: lab2-GreenTargetGroupName
  ALBListenerArn:
    Value: !Ref ALBListener
    Export:
      Name: lab2-ALBListenerArn
