<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Typerush</title>
<style>
    :root {
        --cream:  #fff9ee;
        --card:   #ffffff;
        --ink:    #2f2a24;
        --soft:   #7d7365;
        --faint:  #c6bbab;
        --rule:   #ecdfc9;
        --coral:  #e0522c;
        --teal:   #0f9b8e;
        --amber:  #e08700;
        --plum:   #7d4a99;
        --mono: "SF Mono", "Cascadia Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --cream:  #1b1815;
            --card:   #241f1a;
            --ink:    #f2ebdf;
            --soft:   #a29889;
            --faint:  #57503f;
            --rule:   #362f26;
            --coral:  #ff8360;
            --teal:   #3ad4c4;
            --amber:  #ffc14d;
            --plum:   #cb9ae6;
        }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1.5rem 3rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    .shell { width: 100%; max-width: 44rem; margin: auto; }

    /* ---------- masthead ---------- */
    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.75rem;
    }

    .wordmark {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
    }
    .wordmark b { color: var(--coral); font-weight: 800; }
    .wordmark em {
        font-style: normal;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--soft);
        letter-spacing: 0.05em;
        margin-left: 0.5rem;
    }

    .modes { display: flex; gap: 0.3rem; }

    .modes button {
        font-family: var(--mono);
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--soft);
        background: none;
        border: 1.5px solid var(--rule);
        padding: 0.28rem 0.7rem;
        border-radius: 999px;
        cursor: pointer;
        transition: color .12s, border-color .12s, background .12s;
    }
    .modes button:hover { color: var(--ink); border-color: var(--faint); }
    .modes button[aria-pressed="true"] {
        color: var(--card);
        background: var(--ink);
        border-color: var(--ink);
    }
    .modes button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    /* ---------- readout ---------- */
    .readout {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.7rem;
        margin-bottom: 1.25rem;
    }

    .stat {
        background: var(--card);
        border: 1.5px solid var(--rule);
        border-radius: 12px;
        padding: 0.75rem 0.95rem;
        position: relative;
        overflow: hidden;
    }
    .stat::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: var(--tone, var(--faint));
    }
    .stat.wpm  { --tone: var(--teal); }
    .stat.acc  { --tone: var(--plum); }
    .stat.time { --tone: var(--amber); }

    .stat .k {
        display: block;
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--soft);
    }
    .stat .v {
        font-family: var(--mono);
        font-size: 1.85rem;
        font-weight: 700;
        line-height: 1.15;
        color: var(--tone, var(--ink));
        font-variant-numeric: tabular-nums;
    }

    .held {
        display: none;
        position: absolute;
        right: 0.7rem; top: 0.72rem;
        font-family: var(--mono);
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--amber);
        border: 1px solid var(--amber);
        border-radius: 999px;
        padding: 0.05rem 0.4rem;
    }
    .stat.time.held-on .held { display: block; }
    .stat.time.held-on .v { opacity: 0.55; }

    /* ---------- typing surface ---------- */
    .surface {
        position: relative;
        background: var(--card);
        border: 1.5px solid var(--rule);
        border-radius: 14px;
        padding: 1.4rem 1.5rem;
        cursor: text;
    }
    .surface:focus-within { border-color: var(--teal); }

    .viewport { height: 6.6rem; overflow: hidden; }
    .stream {
        font-family: var(--mono);
        font-size: 1.25rem;
        line-height: 2.2rem;
        transition: transform 0.15s ease;
        color: var(--faint);
    }

    .w { display: inline-block; margin-right: 0.6rem; white-space: nowrap; }
    .c { position: relative; }
    .c.hit   { color: var(--ink); }
    .c.miss  { color: var(--coral); background: color-mix(in srgb, var(--coral) 14%, transparent); border-radius: 2px; }
    .c.extra { color: var(--coral); opacity: 0.55; }

    .c.at::before {
        content: "";
        position: absolute;
        left: -2px; top: 0.12em; bottom: 0.06em;
        width: 2.5px;
        border-radius: 2px;
        background: var(--teal);
        animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    #catcher { position: absolute; inset: 0; opacity: 0; border: 0; padding: 0; font: inherit; resize: none; }

    .veil {
        position: absolute; inset: 0;
        display: none; align-items: center; justify-content: center;
        background: var(--card);
        border-radius: 14px;
        font-family: var(--mono); font-size: 0.82rem; color: var(--soft);
    }
    .surface.blurred .veil { display: flex; }

    /* ---------- result ---------- */
    .result { display: none; margin-top: 1.25rem; }
    .result.show { display: block; }

    .verdict {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.9rem;
    }
    .verdict span { color: var(--coral); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.7rem; }
    .cards div {
        background: var(--card);
        border: 1.5px solid var(--rule);
        border-radius: 12px;
        padding: 0.8rem 0.95rem;
    }
    .cards .k {
        display: block; font-family: var(--mono); font-size: 0.6rem;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft);
    }
    .cards .v { font-family: var(--mono); font-size: 1.5rem; font-weight: 700; }
    .cards .big { font-size: 2.4rem; color: var(--teal); }
    .pb { color: var(--amber) !important; }

    /* ---------- footer ---------- */
    footer {
        display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
        margin-top: 1.5rem;
        font-family: var(--mono); font-size: 0.68rem;
        color: var(--faint); letter-spacing: 0.03em;
    }
    footer kbd {
        font: inherit; border: 1px solid var(--rule); border-radius: 4px;
        padding: 0.05rem 0.32rem; color: var(--soft);
    }
    @media (max-width: 540px) {
        .readout { grid-template-columns: 1fr 1fr; }
        .stat.time { grid-column: span 2; }
        .stream { font-size: 1.08rem; line-height: 2rem; }
        .viewport { height: 6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
</style>
</head>
<body>
<div class="shell">

    <header>
        <div class="wordmark">Type<b>rush</b><em>{{ name }}</em></div>
        <div class="modes" role="group" aria-label="Test length">
            <button type="button" data-secs="15">15s</button>
            <button type="button" data-secs="30" aria-pressed="true">30s</button>
            <button type="button" data-secs="60">60s</button>
        </div>
    </header>

    <div class="readout">
        <div class="stat wpm"><span class="k">wpm</span><span class="v" id="wpm">0</span></div>
        <div class="stat acc"><span class="k">accuracy</span><span class="v" id="acc">100%</span></div>
        <div class="stat time" id="timebox">
            <span class="held">held</span>
            <span class="k">time left</span><span class="v" id="clock">30</span>
        </div>
    </div>

    <div class="surface" id="surface">
        <div class="viewport"><div class="stream" id="stream"></div></div>
        <textarea id="catcher" autocomplete="off" autocorrect="off" autocapitalize="off"
                  spellcheck="false" aria-label="Type here"></textarea>
        <div class="veil">click here, then just start typing</div>
    </div>

    <section class="result" id="result" aria-live="polite">
        <p class="verdict" id="verdict"></p>
        <div class="cards">
            <div><span class="k">words per minute</span><span class="v big" id="r-wpm">0</span></div>
            <div><span class="k">accuracy</span><span class="v" id="r-acc">0%</span></div>
            <div><span class="k">characters</span><span class="v" id="r-chars">0</span></div>
            <div><span class="k">your best</span><span class="v" id="r-best">&mdash;</span></div>
        </div>
    </section>

    <footer>
        <span><kbd>Tab</kbd> again &nbsp;&middot;&nbsp; <kbd>Esc</kbd> new words</span>
    </footer>

</div>

<script>
(function () {
    var stream  = document.getElementById("stream");
    var surface = document.getElementById("surface");
    var catcher = document.getElementById("catcher");
    var elWpm   = document.getElementById("wpm");
    var elAcc   = document.getElementById("acc");
    var elClock = document.getElementById("clock");
    var timeBox = document.getElementById("timebox");
    var result  = document.getElementById("result");
    var verdict = document.getElementById("verdict");

    var IDLE_MS = 2000;          // stop the clock after this long without a key
    var LIMIT = 30;

    var words = [];
    var wi = 0, ci = 0, typed = 0, hits = 0;
    var started = false, done = false, held = true;
    var activeMs = 0, lastKey = 0, lastTick = 0, tick = null;

    /* ---------- words ---------- */

    function fetchWords() {
        return fetch("/api/words?count=120", { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (d) { return d.words; })
            .catch(function () {
                return "the and for you that with have this from they but not are was one all"
                       .split(" ");
            });
    }

    function paint() {
        stream.innerHTML = "";
        words.forEach(function (w) {
            var span = document.createElement("span");
            span.className = "w";
            w.split("").forEach(function (ch) {
                var c = document.createElement("span");
                c.className = "c";
                c.textContent = ch;
                span.appendChild(c);
            });
            stream.appendChild(span);
        });
        stream.style.transform = "translateY(0)";
        mark();
    }

    function mark() {
        var old = stream.querySelector(".c.at");
        if (old) old.classList.remove("at");
        var word = stream.children[wi];
        if (!word) return;
        var cell = word.children[Math.min(ci, word.children.length - 1)];
        if (cell) cell.classList.add("at");

        var lineH = parseFloat(getComputedStyle(stream).lineHeight);
        var line = Math.round(word.offsetTop / lineH);
        stream.style.transform = "translateY(" + (-Math.max(0, line - 1) * lineH) + "px)";
    }

    /* ---------- clock: only counts while you are actually typing ---------- */

    function nudge() {
        if (done) return;
        lastKey = Date.now();
        if (held) {
            held = false;
            lastTick = Date.now();
            timeBox.classList.remove("held-on");
        }
        if (!started) {
            started = true;
            lastTick = Date.now();
            tick = setInterval(beat, 100);
        }
    }

    function beat() {
        var now = Date.now();
        var delta = now - lastTick;
        lastTick = now;

        if (!held && now - lastKey > IDLE_MS) {
            held = true;
            timeBox.classList.add("held-on");
        }
        if (!held) activeMs += delta;

        var left = Math.max(0, LIMIT - Math.floor(activeMs / 1000));
        elClock.textContent = left;
        stats();
        if (left <= 0) finish();
    }

    function wpmNow() {
        var mins = activeMs / 60000;
        return mins > 0 ? Math.max(0, Math.round((hits / 5) / mins)) : 0;
    }

    function stats() {
        elWpm.textContent = wpmNow();
        elAcc.textContent = (typed ? Math.round((hits / typed) * 100) : 100) + "%";
    }

    /* ---------- finish ---------- */

    var LINES = [
        [0,   "Everyone starts somewhere."],
        [30,  "Solid. Keep the rhythm going."],
        [50,  "That is a good pace."],
        [70,  "Quick fingers."],
        [90,  "Genuinely fast."],
        [110, "Show off."]
    ];

    function finish() {
        clearInterval(tick);
        done = true;
        held = true;
        timeBox.classList.remove("held-on");

        var wpm = wpmNow();
        var acc = typed ? Math.round((hits / typed) * 100) : 100;

        document.getElementById("r-wpm").textContent = wpm;
        document.getElementById("r-acc").textContent = acc + "%";
        document.getElementById("r-chars").textContent = hits + " / " + typed;

        var line = LINES[0][1];
        LINES.forEach(function (row) { if (wpm >= row[0]) line = row[1]; });

        var key = "typerush-best-" + LIMIT;
        var best = 0;
        try { best = parseInt(localStorage.getItem(key) || "0", 10); } catch (e) {}
        var elBest = document.getElementById("r-best");

        if (wpm > best) {
            try { localStorage.setItem(key, String(wpm)); } catch (e) {}
            elBest.textContent = wpm;
            elBest.classList.add("pb");
            verdict.innerHTML = "New personal best. <span>" + line + "</span>";
        } else {
            elBest.textContent = best || "—";
            elBest.classList.remove("pb");
            verdict.innerHTML = line + " <span>Try again?</span>";
        }
        result.classList.add("show");
    }

    /* ---------- reset ---------- */

    function reset(fresh) {
        clearInterval(tick);
        wi = 0; ci = 0; typed = 0; hits = 0;
        started = false; done = false; held = true;
        activeMs = 0;
        elClock.textContent = LIMIT;
        elWpm.textContent = "0";
        elAcc.textContent = "100%";
        timeBox.classList.remove("held-on");
        result.classList.remove("show");
        if (fresh) { fetchWords().then(function (w) { words = w; paint(); }); }
        else { paint(); }
    }

    /* ---------- typing ---------- */

    function type(ch) {
        var word = stream.children[wi];
        if (!word) return;
        nudge();
        typed++;
        if (ci < words[wi].length) {
            var cell = word.children[ci];
            if (ch === words[wi][ci]) { cell.className = "c hit"; hits++; }
            else { cell.className = "c miss"; }
        } else {
            var extra = document.createElement("span");
            extra.className = "c extra";
            extra.textContent = ch;
            word.appendChild(extra);
        }
        ci++;
        mark();
    }

    function space() {
        if (ci === 0) return;
        nudge();
        wi++; ci = 0;
        if (wi >= words.length) { finish(); return; }
        mark();
    }

    function back() {
        if (ci === 0) return;
        nudge();
        var word = stream.children[wi];
        ci--;
        var cell = word.children[ci];
        if (cell.classList.contains("extra")) cell.remove();
        else {
            if (cell.classList.contains("hit")) hits--;
            cell.className = "c";
        }
        if (typed > 0) typed--;
        mark();
    }

    document.addEventListener("keydown", function (e) {
        if (e.key === "Tab")    { e.preventDefault(); reset(false); catcher.focus(); return; }
        if (e.key === "Escape") { e.preventDefault(); reset(true);  catcher.focus(); return; }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (done) return;
        if (e.key === "Backspace") { e.preventDefault(); back();  return; }
        if (e.key === " ")         { e.preventDefault(); space(); return; }
        if (e.key.length === 1)    { e.preventDefault(); type(e.key); }
    });

    catcher.addEventListener("focus", function () { surface.classList.remove("blurred"); });
    catcher.addEventListener("blur",  function () { surface.classList.add("blurred"); });
    surface.addEventListener("click", function () { catcher.focus(); });
    document.addEventListener("keydown", function () { if (!done) catcher.focus(); });

    Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (b) {
        b.addEventListener("click", function () {
            Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (o) {
                o.removeAttribute("aria-pressed");
            });
            b.setAttribute("aria-pressed", "true");
            LIMIT = parseInt(b.dataset.secs, 10);
            reset(true);
            catcher.focus();
        });
    });

    reset(true);
    surface.classList.add("blurred");
})();
</script>
</body>
</html>
